<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Test Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1b1b1f;
    --muted: #6b6b76;
    --green: #1a8f4c;
    --green-bg: #e6f7ec;
    --yellow: #9a7300;
    --yellow-bg: #fdf3d9;
    --red: #c22a2a;
    --red-bg: #fbe7e7;
    --accent: #4c5fd5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #201f24;
      --border: #33323a;
      --text: #ececef;
      --muted: #9a9aa2;
      --green: #4ad088;
      --green-bg: #163826;
      --yellow: #e0c04d;
      --yellow-bg: #3a3218;
      --red: #ff6b6b;
      --red-bg: #3a1e1e;
      --accent: #8b98ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .badge.running { background: var(--yellow-bg); color: var(--yellow); }
  .badge.done-pass { background: var(--green-bg); color: var(--green); }
  .badge.done-fail { background: var(--red-bg); color: var(--red); }
  .badge.idle { background: var(--border); color: var(--muted); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
  }
  .running .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .suite { margin-bottom: 14px; }
  .suite:last-child { margin-bottom: 0; }
  .suite-name {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .test-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 0;
    font-size: 14px;
  }
  .test-row .icon { flex-shrink: 0; }
  .test-row.passed .icon { color: var(--green); }
  .test-row.failed .icon { color: var(--red); }
  .fail-msg {
    margin: 4px 0 8px 22px;
    padding: 8px 10px;
    background: var(--red-bg);
    color: var(--red);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct { display: inline-block; min-width: 48px; text-align: right; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .pct.red { background: var(--red-bg); color: var(--red); }
  .pct.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .pct.green { background: var(--green-bg); color: var(--green); }

  .empty { color: var(--muted); font-size: 13px; }
  .error-box {
    background: var(--red-bg); color: var(--red); border-radius: 8px;
    padding: 12px; font-family: ui-monospace, monospace; font-size: 12px;
    white-space: pre-wrap;
  }
  .summary-line { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🧪 Auth Test Dashboard</h1>
      <div class="sub" id="subtitle">รอผลการทดสอบ...</div>
    </div>
    <span class="badge idle" id="status-badge"><span class="dot"></span><span id="status-text">idle</span></span>
  </div>

  <div class="panel" id="error-panel" style="display:none">
    <h2>Error</h2>
    <div class="error-box" id="error-box"></div>
  </div>

  <div class="panel">
    <h2>Test results</h2>
    <div id="results"><div class="empty">ยังไม่มีผลการทดสอบ</div></div>
    <div class="summary-line" id="summary-line"></div>
  </div>

  <div class="panel">
    <h2>Coverage</h2>
    <div id="coverage"><div class="empty">ยังไม่มีข้อมูล coverage</div></div>
  </div>

<script>
  function pctClass(v) {
    if (v < 50) return 'red';
    if (v < 80) return 'yellow';
    return 'green';
  }

  function renderResults(results) {
    const el = document.getElementById('results');
    const summaryEl = document.getElementById('summary-line');
    if (!results) {
      el.innerHTML = '<div class="empty">ยังไม่มีผลการทดสอบ</div>';
      summaryEl.textContent = '';
      return;
    }
    let html = '';
    for (const suite of results.testResults) {
      const shortName = suite.name.split('/backend/')[1] || suite.name;
      html += '<div class="suite">';
      html += '<div class="suite-name">' + shortName + '</div>';
      for (const t of suite.assertionResults) {
        const passed = t.status === 'passed';
        html += '<div class="test-row ' + (passed ? 'passed' : 'failed') + '">';
        html += '<span class="icon">' + (passed ? '✓' : '✕') + '</span>';
        html += '<span>' + escapeHtml(t.fullName) + '</span>';
        html += '</div>';
        if (!passed && t.failureMessages && t.failureMessages.length) {
          html += '<div class="fail-msg">' + escapeHtml(t.failureMessages.join('\\n')) + '</div>';
        }
      }
      html += '</div>';
    }
    el.innerHTML = html || '<div class="empty">ไม่มี test suite</div>';
    summaryEl.textContent =
      results.numTotalTests + ' tests · ' +
      results.numPassedTests + ' passed · ' +
      results.numFailedTests + ' failed · ' +
      results.numTotalTestSuites + ' suites';
  }

  function renderCoverage(coverage) {
    const el = document.getElementById('coverage');
    if (!coverage) {
      el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล coverage</div>';
      return;
    }
    const rows = Object.entries(coverage)
      .filter(([key]) => key !== 'total')
      .sort(([a], [b]) => a.localeCompare(b));

    function cell(metric) {
      const pct = metric.pct;
      return '<td class="num"><span class="pct ' + pctClass(pct) + '">' + pct.toFixed(0) + '%</span></td>';
    }

    let html = '<table><thead><tr>';
    html += '<th>File</th><th>Stmts</th><th>Branch</th><th>Funcs</th><th>Lines</th>';
    html += '</tr></thead><tbody>';

    if (coverage.total) {
      html += '<tr style="font-weight:600">';
      html += '<td>ALL FILES</td>';
      html += cell(coverage.total.statements);
      html += cell(coverage.total.branches);
      html += cell(coverage.total.functions);
      html += cell(coverage.total.lines);
      html += '</tr>';
    }

    for (const [file, metric] of rows) {
      const shortFile = file.split('/backend/')[1] || file;
      html += '<tr>';
      html += '<td>' + escapeHtml(shortFile) + '</td>';
      html += cell(metric.statements);
      html += cell(metric.branches);
      html += cell(metric.functions);
      html += cell(metric.lines);
      html += '</tr>';
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function applyState(state) {
    const badge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const subtitle = document.getElementById('subtitle');
    const errorPanel = document.getElementById('error-panel');
    const errorBox = document.getElementById('error-box');

    badge.className = 'badge';
    if (state.status === 'running') {
      badge.classList.add('running');
      statusText.textContent = 'running...';
      subtitle.textContent = 'เริ่มรันเมื่อ ' + new Date(state.startedAt).toLocaleTimeString();
    } else if (state.status === 'done') {
      const failed = state.results && state.results.numFailedTests > 0;
      badge.classList.add(failed ? 'done-fail' : 'done-pass');
      statusText.textContent = failed ? 'failed' : 'passed';
      subtitle.textContent = 'อัปเดตล่าสุด ' + new Date(state.finishedAt).toLocaleTimeString() + ' — แก้ไขไฟล์ใน src/ หรือ test/ แล้วบันทึก จะรันให้อัตโนมัติ';
    } else {
      badge.classList.add('idle');
      statusText.textContent = 'idle';
    }

    if (state.error) {
      errorPanel.style.display = 'block';
      errorBox.textContent = state.error;
    } else {
      errorPanel.style.display = 'none';
    }

    renderResults(state.results);
    renderCoverage(state.coverage);
  }

  const source = new EventSource('/events');
  source.onmessage = (event) => {
    applyState(JSON.parse(event.data));
  };
</script>
</body>
</html>
