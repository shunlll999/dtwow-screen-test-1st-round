# โหมด production (default สำหรับ deploy):
#   docker compose -f docker-compose.yml up --build
#   -> frontend จะ next build แล้ว next start
#
# โหมด dev (hot reload): แค่ `docker compose up` เฉยๆ
#   compose จะ merge docker-compose.override.yml ให้อัตโนมัติ
services:
  postgres:
    image: postgres:16-alpine
    container_name: dtwow-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dtwow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dtwow-backend
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dtwow?schema=public
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=dev-only-change-me-in-production
      - JWT_EXPIRES_IN=1d
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: dtwow-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    command: npm run start
    depends_on:
      - backend

volumes:
  postgres_data:
